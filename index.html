<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 Irresponsables Dijeron</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800;900&display=swap');

    :root {
      --bg-dark: #050a24;
      --bg-panel: #0b174a;
      --gold: #ffcc00;
      --gold-dark: #d49b00;
      --neon-blue: #00d9ff;
      --neon-pink: #ff2a85;
      --danger: #ff1e1e;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #11236b 0%, #050a24 85%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Luces decorativas superiores */
    .marquee-lights {
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      background: #030616;
      border-bottom: 3px solid var(--gold);
    }

    .bulb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff6b3;
      box-shadow: 0 0 12px 4px var(--gold);
      animation: blink 1.2s infinite alternate;
    }

    .bulb:nth-child(even) {
      animation-delay: 0.6s;
      background: #b3f5ff;
      box-shadow: 0 0 12px 4px var(--neon-blue);
    }

    @keyframes blink {
      0% { opacity: 0.35; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* Encabezado */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(180deg, #ffea75 0%, #ffaa00 50%, #cc7a00 100%);
      padding: 8px 26px;
      border-radius: 50px;
      border: 4px solid #fff;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.4);
      transform: rotate(-1deg);
    }

    .logo-badge h1 {
      font-family: 'Anton', sans-serif;
      font-size: 2rem;
      letter-spacing: 1.5px;
      color: #09123b;
      text-shadow: 1px 1px 0px #fff;
    }

    .top-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-gold {
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      color: #081036;
      box-shadow: 0 4px 0 #8a6300;
    }

    .btn-blue {
      background: linear-gradient(180deg, #00d9ff, #0088cc);
      color: #041024;
      box-shadow: 0 4px 0 #005580;
    }

    .btn-red {
      background: linear-gradient(180deg, #ff4d4d, #cc0000);
      color: #fff;
      box-shadow: 0 4px 0 #7a0000;
    }

    .btn-green {
      background: linear-gradient(180deg, #00e676, #00a854);
      color: #041c0e;
      box-shadow: 0 4px 0 #006633;
      width: 100%;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    /* Arena principal */
    .arena {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 20px;
      padding: 10px 28px 24px;
      flex: 1;
      align-items: center;
      max-width: 1450px;
      width: 100%;
      margin: 0 auto;
    }

    /* Paneles de Equipos */
    .team-card {
      background: linear-gradient(180deg, #0f216b 0%, #07103b 100%);
      border: 4px solid var(--neon-blue);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 217, 255, 0.35);
    }

    .team-card.team-2 {
      border-color: var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 42, 133, 0.35);
    }

    .team-name-input {
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      text-align: center;
      width: 100%;
      padding: 6px;
      margin-bottom: 14px;
      outline: none;
    }

    .team-name-input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.15);
    }

    .team-score {
      font-family: 'Anton', sans-serif;
      font-size: 4.2rem;
      background: #020514;
      border: 3px solid var(--gold);
      border-radius: 12px;
      padding: 10px 0;
      color: var(--gold);
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.7);
      margin-bottom: 10px;
    }

    .score-adjust {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .score-adjust button {
      padding: 5px 12px;
      font-size: 0.8rem;
      background: #1b2f85;
      color: #fff;
    }

    /* Centro: Bolsa, Pregunta y Tablero */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .round-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 14px;
    }

    .round-pill {
      background: #09154a;
      border: 2px solid var(--neon-blue);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--neon-blue);
    }

    .pot-box {
      background: #020514;
      border: 4px solid var(--gold);
      border-radius: 16px;
      padding: 6px 32px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.45);
    }

    .pot-label {
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #ccc;
      font-weight: 800;
    }

    .pot-value {
      font-family: 'Anton', sans-serif;
      font-size: 3rem;
      color: #fff;
      line-height: 1.05;
      text-shadow: 0 0 15px var(--gold);
    }

    .strikes-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #09154a;
      border: 2px solid #ff4d4d;
      padding: 6px 14px;
      border-radius: 12px;
    }

    .mini-x {
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      color: #3a1525;
      transition: all 0.2s;
    }

    .mini-x.active {
      color: var(--danger);
      text-shadow: 0 0 12px var(--danger);
      transform: scale(1.15);
    }

    /* Pregunta */
    .question-box {
      width: 100%;
      background: linear-gradient(180deg, #102475 0%, #081242 100%);
      border: 3px solid var(--gold);
      border-radius: 14px;
      padding: 14px 20px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tablero de 6 respuestas */
    .board {
      width: 100%;
      background: #03071c;
      border: 6px solid var(--gold);
      border-radius: 20px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 76px);
      grid-auto-flow: column;
      gap: 14px;
      box-shadow: 0 0 35px rgba(255, 204, 0, 0.35), inset 0 0 25px rgba(0, 0, 0, 0.9);
    }

    .card-slot {
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .card-slot.revealed .card-inner {
      transform: rotateX(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #4da6ff;
    }

    /* Frente oculto con número */
    .card-front {
      background: linear-gradient(180deg, #1638b8 0%, #091963 100%);
      box-shadow: inset 0 0 15px rgba(0, 217, 255, 0.4);
    }

    .number-oval {
      width: 54px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d9ff 0%, #0055cc 100%);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 1.7rem;
      color: #fff;
      text-shadow: 1px 2px 3px #000;
    }

    /* Reverso descubierto */
    .card-back {
      background: linear-gradient(180deg, #0d237a 0%, #050f40 100%);
      border-color: var(--gold);
      transform: rotateX(180deg);
      justify-content: space-between;
      padding: 0 0 0 16px;
      overflow: hidden;
    }

    .answer-text {
      font-weight: 900;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
      text-align: left;
      padding-right: 10px;
      line-height: 1.2;
    }

    .answer-points {
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      color: #050a24;
      font-family: 'Anton', sans-serif;
      font-size: 1.9rem;
      height: 100%;
      min-width: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 3px solid #fff;
    }

    /* Barra inferior de ayuda */
    .keyboard-guide {
      background: rgba(3, 6, 22, 0.85);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    kbd {
      background: #1e293b;
      border: 2px solid var(--gold);
      border-radius: 6px;
      padding: 2px 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      color: var(--gold);
      margin-right: 4px;
    }

    /* Overlay gigante de X Roja */
    #strike-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    #strike-overlay.show {
      opacity: 1;
    }

    .giant-x {
      width: 210px;
      height: 210px;
      border: 16px solid var(--danger);
      border-radius: 28px;
      background: #1a0000;
      color: var(--danger);
      font-family: 'Anton', sans-serif;
      font-size: 11rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px var(--danger), inset 0 0 30px var(--danger);
      animation: popShake 0.45s ease;
    }

    @keyframes popShake {
      0% { transform: scale(0.3); }
      50% { transform: scale(1.12) rotate(-3deg); }
      75% { transform: scale(0.96) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Modal Editor de Preguntas */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 5, 20, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #0c1952;
      border: 4px solid var(--gold);
      border-radius: 18px;
      max-width: 820px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 22px;
      background: #060e33;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .editor-round-card {
      background: #07103b;
      border: 2px solid #2b44a8;
      border-radius: 12px;
      padding: 14px;
    }

    .editor-round-card label {
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: 800;
      display: block;
      margin-bottom: 6px;
    }

    .editor-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #3b59d1;
      background: #03071c;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .editor-answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .editor-answer-row {
      display: grid;
      grid-template-columns: 26px 1fr 68px;
      gap: 6px;
      align-items: center;
    }

    .editor-answer-row span {
      font-weight: 900;
      color: var(--neon-blue);
    }

    .editor-answer-row input {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #3b59d1;
      background: #03071c;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
    }

    .modal-footer {
      padding: 14px 22px;
      background: #060e33;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 2px solid var(--gold);
    }

    @media (max-width: 1024px) {
      .arena {
        grid-template-columns: 1fr;
      }
      .board {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, 68px);
        grid-auto-flow: row;
      }
    }
  </style>
</head>
<body>

  <!-- Luces de foro de TV -->
  <div class="marquee-lights" id="lights-bar"></div>

  <!-- Encabezado -->
  <header>
    <div class="logo-badge">
      <h1>100 IRRESPONSABLES DIJERON</h1>
    </div>

    <div class="top-controls">
      <button class="btn-blue" onclick="prevRound()">◀ Anterior</button>
      <button class="btn-blue" onclick="nextRound()">Siguiente ▶</button>
      <button class="btn-red" onclick="triggerStrike()">❌ Error (Tecla 0)</button>
      <button class="btn-blue" onclick="clearStrikes()">Limpiar X (C)</button>
      <button class="btn-gold" onclick="openEditor()">✏️ Editar Preguntas</button>
    </div>
  </header>

  <!-- Escenario Principal -->
  <main class="arena">
    <!-- Equipo 1 -->
    <section class="team-card">
      <input type="text" class="team-name-input" id="team1-name" value="X" title="Haz clic para editar nombre" />
      <div class="team-score" id="team1-score">0</div>
      <div class="score-adjust">
        <button onclick="adjustScore(1, -10)">-10</button>
        <button onclick="adjustScore(1, 10)">+10</button>
      </div>
      <button class="btn-green" onclick="awardPot(1)">🏆 Dar Puntos Ronda</button>
    </section>

    <!-- Tablero Central -->
    <section class="center-stage">
      <div class="round-header">
        <div class="round-pill" id="round-indicator">RONDA 1 DE 10</div>

        <div class="pot-box">
          <div class="pot-label">PUNTOS EN JUEGO</div>
          <div class="pot-value" id="round-pot">0</div>
        </div>

        <div class="strikes-bar" title="Errores actuales">
          <span class="mini-x" id="mini-x-1">X</span>
          <span class="mini-x" id="mini-x-2">X</span>
          <span class="mini-x" id="mini-x-3">X</span>
        </div>
      </div>

      <div class="question-box" id="question-display">
        Cargando pregunta...
      </div>

      <div class="board" id="answers-board">
        <!-- Las 6 tarjetas se generan con JS -->
      </div>
    </section>

    <!-- Equipo 2 -->
    <section class="team-card team-2">
      <input type="text" class="team-name-input" id="team2-name" value="Y" title="Haz clic para editar nombre" />
      <div class="team-score" id="team2-score">0</div>
      <div class="score-adjust">
        <button onclick="adjustScore(2, -10)">-10</button>
        <button onclick="adjustScore(2, 10)">+10</button>
      </div>
      <button class="btn-green" onclick="awardPot(2)">🏆 Dar Puntos Ronda</button>
    </section>
  </main>

  <!-- Guía de Atajos -->
  <footer class="keyboard-guide">
    <span><kbd>1</kbd> a <kbd>6</kbd> Revelar respuesta</span>
    <span><kbd>0</kbd> Respuesta errónea (❌)</span>
    <span><kbd>C</kbd> Limpiar X (para robo de puntos)</span>
    <span><kbd>←</kbd> <kbd>→</kbd> Cambiar de pregunta</span>
  </footer>

  <!-- Overlay gigante de X -->
  <div id="strike-overlay"></div>

  <!-- Modal Editor de Preguntas -->
  <div class="modal-backdrop" id="editor-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 style="color: var(--gold); font-size: 1.2rem;">✏️ EDITAR LAS 10 PREGUNTAS Y RESPUESTAS</h2>
        <button class="btn-red" onclick="closeEditor()">Cerrar</button>
      </div>
      <div class="modal-body" id="editor-list"></div>
      <div class="modal-footer">
        <button class="btn-red" onclick="resetDefaultQuestions()">Restaurar Ejemplos</button>
        <button class="btn-green" style="width: auto; margin: 0;" onclick="saveEditor()">💾 Guardar Cambios</button>
      </div>
    </div>
  </div>

          { text: "ANGEL R.", points: 23 },
          { text: "SR. ISAIAS", points: 16 },
          { text: "ANGEL G.", points: 13 },
          { text: "JUAN DE DIOS", points: 8 },
          { text: "CHRISTOPHER(SARCASMO)", points: 1 }
        ]
      }
    ];

    let questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
    try {
      const saved = localStorage.getItem('irresponsables_questions');
      if (saved) {
        questions = JSON.parse(saved);
      }
    } catch(e) {
      console.log("Usando preguntas por defecto");
    }

    let currentRound = 0;
    let revealed = [false, false, false, false, false, false];
    let roundPot = 0;
    let strikes = 0;
    let scores = { 1: 0, 2: 0 };

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playCorrectSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.25, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.45);
        });
      } catch(e) {}
    }

    function playBuzzerSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [110, 116].forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.linearRampToValueAtTime(82, now + 0.65);
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.7);
        });
      } catch(e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const chord = [523.25, 659.25, 783.99, 1046.50];
        chord.forEach((freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.8);
        });
      } catch(e) {}
    }

    function initLights() {
      const bar = document.getElementById('lights-bar');
      if(!bar) return;
      for (let i = 0; i < 28; i++) {
        const bulb = document.createElement('div');
        bulb.className = 'bulb';
        bar.appendChild(bulb);
      }
    }

    function renderRound() {
      const q = questions[currentRound] || questions[0];
      document.getElementById('round-indicator').textContent = `RONDA ${currentRound + 1} DE ${questions.length}`;
      document.getElementById('question-display').textContent = q.question;
      document.getElementById('round-pot').textContent = roundPot;

      const board = document.getElementById('answers-board');
      board.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const ans = q.answers[i] || { text: '---', points: 0 };
        const slot = document.createElement('div');
        slot.className = `card-slot ${revealed[i] ? 'revealed' : ''}`;
        slot.onclick = () => toggleAnswer(i);

        slot.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="number-oval">${i + 1}</div>
            </div>
            <div class="card-back">
              <div class="answer-text">${ans.text}</div>
              <div class="answer-points">${ans.points}</div>
            </div>
          </div>
        `;
        board.appendChild(slot);
      }
      updateStrikesUI();
    }

    function toggleAnswer(index) {
      if (index < 0 || index > 5) return;
      const q = questions[currentRound];
      const pts = Number(q.answers[index]?.points || 0);

      if (!revealed[index]) {
        revealed[index] = true;
        roundPot += pts;
        playCorrectSound();
      } else {
        revealed[index] = false;
        roundPot = Math.max(0, roundPot - pts);
      }

      document.getElementById('round-pot').textContent = roundPot;
      const slots = document.querySelectorAll('.card-slot');
      if (slots[index]) {
        slots[index].classList.toggle('revealed', revealed[index]);
      }
    }

    let strikeTimeout;
    function triggerStrike() {
      playBuzzerSound();
      if (strikes < 3) {
        strikes++;
      } else {
        strikes = 1;
      }
      updateStrikesUI();

      const overlay = document.getElementById('strike-overlay');
      overlay.innerHTML = '';
      for (let i = 0; i < strikes; i++) {
        const xBox = document.createElement('div');
        xBox.className = 'giant-x';
        xBox.textContent = 'X';
        overlay.appendChild(xBox);
      }

      overlay.classList.add('show');
      clearTimeout(strikeTimeout);
      strikeTimeout = setTimeout(() => {
        overlay.classList.remove('show');
      }, 1350);
    }

    function clearStrikes() {
      strikes = 0;
      updateStrikesUI();
    }

    function updateStrikesUI() {
      for (let i = 1; i <= 3; i++) {
        const el = document.getElementById(`mini-x-${i}`);
        if(el) el.classList.toggle('active', i <= strikes);
      }
    }

    function awardPot(team) {
      if (roundPot <= 0) return;
      scores[team] += roundPot;
      roundPot = 0;
      document.getElementById(`team${team}-score`).textContent = scores[team];
      document.getElementById('round-pot').textContent = 0;
      playFanfareSound();
    }

    function adjustScore(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      document.getElementById(`team${team}-score`).textContent = scores[team];
    }

    function nextRound() {
      currentRound = (currentRound + 1) % questions.length;
      resetRoundState();
    }

    function prevRound() {
      currentRound = (currentRound - 1 + questions.length) % questions.length;
      resetRoundState();
    }

    function resetRoundState() {
      revealed = [false, false, false, false, false, false];
      roundPot = 0;
      strikes = 0;
      renderRound();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (document.getElementById('editor-modal').classList.contains('open')) return;

      if (e.key >= '1' && e.key <= '6') {
        e.preventDefault();
        toggleAnswer(parseInt(e.key, 10) - 1);
      } else if (e.key === '0') {
        e.preventDefault();
        triggerStrike();
      } else if (e.key.toLowerCase() === 'c') {
        clearStrikes();
      } else if (e.key === 'ArrowRight') {
        nextRound();
      } else if (e.key === 'ArrowLeft') {
        prevRound();
      }
    });

    function openEditor() {
      const list = document.getElementById('editor-list');
      list.innerHTML = '';

      questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'editor-round-card';

        let answersHTML = '';
        for (let aIdx = 0; aIdx < 6; aIdx++) {
          const ans = q.answers[aIdx] || { text: '', points: 0 };
          const safeText = String(ans.text).replace(/"/g, '&quot;');
          answersHTML += `
            <div class="editor-answer-row">
              <span>#${aIdx + 1}</span>
              <input type="text" id="ed-q-${qIdx}-a-${aIdx}" value="${safeText}" placeholder="Respuesta ${aIdx + 1}" />
              <input type="number" id="ed-q-${qIdx}-p-${aIdx}" value="${ans.points}" min="0" max="100" title="Puntos" />
            </div>
          `;
        }

        const safeQText = String(q.question).replace(/"/g, '&quot;');
        card.innerHTML = `
          <label>PREGUNTA ${qIdx + 1}</label>
          <input type="text" class="editor-input" id="ed-q-${qIdx}" value="${safeQText}" />
          <div class="editor-answers-grid">${answersHTML}</div>
        `;
        list.appendChild(card);
      });

      document.getElementById('editor-modal').classList.add('open');
    }

    function closeEditor() {
      document.getElementById('editor-modal').classList.remove('open');
    }

    function saveEditor() {
      const updated = [];
      for (let qIdx = 0; qIdx < questions.length; qIdx++) {
        const qInput = document.getElementById(`ed-q-${qIdx}`);
        const qText = qInput ? qInput.value.trim() : `Pregunta ${qIdx + 1}`;
        const ansArr = [];
        for (let aIdx = 0; aIdx < 6; aIdx++) {
          const tInput = document.getElementById(`ed-q-${qIdx}-a-${aIdx}`);
          const pInput = document.getElementById(`ed-q-${qIdx}-p-${aIdx}`);
          const aText = tInput ? tInput.value.trim() : '---';
          const aPts = pInput ? parseInt(pInput.value, 10) || 0 : 0;
          ansArr.push({ text: aText, points: aPts });
        }
        updated.push({ question: qText, answers: ansArr });
      }
      questions = updated;
      try {
        localStorage.setItem('irresponsables_questions', JSON.stringify(questions));
      } catch(e) {}
      closeEditor();
      resetRoundState();
    }

    function resetDefaultQuestions() {
      questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
      try {
        localStorage.removeItem('irresponsables_questions');
      } catch(e) {}
      openEditor();
      resetRoundState();
    }

    initLights();
    renderRound();
  </script>
</body>
</html>
